# Cloudflare Pages configuration for Plantdex.
#
# The app is a static Vite build (output in `dist/`) plus the Pages Functions in
# `functions/`. Secrets (e.g. DRAGONEYE_API_KEY for the future scan proxy) are
# NOT stored here — add them as encrypted environment variables in the Pages
# dashboard, or locally in `.dev.vars` (gitignored) for `wrangler pages dev`.
name = "plantdex"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-01"

# The /api/scan Function uses the `dragoneye-node` SDK. `nodejs_compat` lets the
# bundler resolve the SDK's optional `node:fs`/`node:path` imports (used only by
# a file-path helper we never call); the SDK decodes results with pure-JS
# hyparquet + fzstd, so no WASM/eval is needed at runtime.
compatibility_flags = ["nodejs_compat"]
